receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

exporters:
  # Export traces to stdout (dev) — swap for Tempo/Jaeger/Azure Monitor in prod
  debug:
    verbosity: normal
  # Prometheus metrics scrape endpoint
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: aegisops

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
